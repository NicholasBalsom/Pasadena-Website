  <span class="dot" onclick="currentSlide(1)"></span>

  <span class="dot" onclick="currentSlide(7)"></span> 
  <span class="dot" onclick="currentSlide(8)"></span>
</div>

<h1 id="CHANGE">placeholder1</h1>

<script>

let SLIDE_C = 1;
let slideIndex = 1;
showSlides(slideIndex);

function plusSlides(n) {
  showSlides(slideIndex += n);
  Slide_num_pic(SLIDE_C += n);
}

function currentSlide(n) {
  showSlides(slideIndex = n);
  Slide_num_pic(SLIDE_C = n);
}

function showSlides(n) {
  let i;
  let slides = document.getElementsByClassName("mySlides");
  let dots = document.getElementsByClassName("dot");
  if (n > slides.length) {slideIndex = 1}    
  if (n < 1) {slideIndex = slides.length}
  for (i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";  
  }
  for (i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", "");
  }
  slides[slideIndex-1].style.display = "block";  
  dots[slideIndex-1].className += " active";
}



function Slide_num_pic(n){
if(n < 1){Slide_pic(SLIDE_C = 8);}
else if(n > 8){Slide_pic(SLIDE_C = 1);}
else{Slide_pic(SLIDE_C = n);}

}

function Slide_pic(n){
if(n == 1){document.getElementById('CHANGE').innerHTML = 'placeholder1'}
if(n == 2){document.getElementById('CHANGE').innerHTML = 'placeholder2'}
if(n == 3){document.getElementById('CHANGE').innerHTML = 'placeholder3'}
if(n == 4){document.getElementById('CHANGE').innerHTML = 'placeholder4'}
if(n == 5){document.getElementById('CHANGE').innerHTML = 'placeholder5'}
if(n == 6){document.getElementById('CHANGE').innerHTML = 'placeholder6'}
if(n == 7){document.getElementById('CHANGE').innerHTML = 'placeholder7'}
if(n == 8){document.getElementById('CHANGE').innerHTML = 'placeholder8'}
}



</script>
